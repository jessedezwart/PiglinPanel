<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div th:if="${profile == null}" class="empty-state">No server selected.</div>

  <div th:if="${profile != null}" class="split" style="height: calc(100vh - 120px);">
    <div class="split-left">
      <ul class="log-files-list">
        <li>
          <a hx-get="/logs/content"
             th:hx-vals='|{"serverId": "${serverId}", "filter": ""}|'
             hx-target="#log-content"
             hx-swap="outerHTML"
             data-ws-latest
             th:classappend="${currentLogPath == 'latest.log'} ? ' active'">
            <wa-icon name="file-waveform"></wa-icon>
            <span>latest.log</span>
          </a>
        </li>
        <li th:each="f : ${logFiles}" th:if="${f.name != 'latest.log'}">
          <a th:hx-get="'/logs/file?serverId=' + ${serverId} + '&amp;path=' + ${f.name}"
             hx-target="#log-content"
             hx-swap="outerHTML">
            <wa-icon name="file-lines"></wa-icon>
            <span th:text="${f.name}"></span>
          </a>
        </li>
      </ul>
    </div>
    <div class="split-right">
      <div class="log-filter">
        <wa-input id="log-filter-input" placeholder="Filter..." th:value="${filter}" size="small" clearable></wa-input>
      </div>
      <div th:replace="~{fragments/logs :: log-content}"></div>
    </div>
  </div>

  <script th:inline="javascript">
    const _logServerId = /*[[${serverId}]]*/ '';
    let _viewingLatest = /*[[${isLatest}]]*/ false;
    let _logFilter = /*[[${filter}]]*/ '';
    let _logWs = null;
    let _logAtBottom = true;
    let _logScrollTop = 0;
    let _logScrollContainer = null;

    function getLogScrollContainer() {
      const el = document.getElementById('log-content');
      if (!el) return null;
      let node = el.parentElement;
      while (node && node !== document.body) {
        const style = getComputedStyle(node);
        if ((style.overflowY === 'auto' || style.overflowY === 'scroll') && node.scrollHeight > node.clientHeight) {
          return node;
        }
        node = node.parentElement;
      }
      return document.scrollingElement || document.documentElement;
    }

    function saveLogScroll() {
      const c = getLogScrollContainer();
      _logScrollContainer = c;
      if (!c) return;
      _logScrollTop = c.scrollTop;
      _logAtBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 50;
    }

    function restoreLogScroll() {
      if (!_logScrollContainer) return;
      if (_logAtBottom) {
        _logScrollContainer.scrollTop = _logScrollContainer.scrollHeight;
      } else {
        _logScrollContainer.scrollTop = _logScrollTop;
      }
    }

    function highlightLogs() {
      const el = document.getElementById('log-content');
      if (!el) return;
      delete el.dataset.highlighted;
      hljs.highlightElement(el);
    }

    function connectLogWs() {
      if (_logWs) {
        _logWs.onmessage = null;
        _logWs.close();
      }
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${proto}//${location.host}/ws/logs?serverId=${encodeURIComponent(_logServerId)}&filter=${encodeURIComponent(_logFilter)}`;
      _logWs = new WebSocket(url);
      _logWs.onmessage = function(e) {
        const msg = JSON.parse(e.data);
        const el = document.getElementById('log-content');
        if (!el) return;
        saveLogScroll();
        if (msg.type === 'init') {
          el.textContent = msg.content;
        } else if (msg.type === 'append') {
          el.textContent = el.textContent + msg.content;
        }
        highlightLogs();
        restoreLogScroll();
      };
    }

    function disconnectLogWs() {
      if (_logWs) {
        _logWs.onmessage = null;
        _logWs.close();
        _logWs = null;
      }
    }

    function updateLogFilter(value) {
      _logFilter = value;
      if (_viewingLatest) {
        if (_logWs && _logWs.readyState === WebSocket.OPEN) {
          _logWs.send(JSON.stringify({filter: value}));
        }
      } else {
        const el = document.getElementById('log-content');
        if (!el) return;
        el.setAttribute('hx-vals', JSON.stringify({filter: value}));
        htmx.trigger(el, 'updateFilter');
      }
    }

    const _logFilterInput = document.getElementById('log-filter-input');
    // Web Awesome inputs emit a native `input` event; also handle `wa-input`/`wa-clear` for safety.
    _logFilterInput?.addEventListener('input', function(e) {
      updateLogFilter(e.target.value || '');
    });
    _logFilterInput?.addEventListener('wa-input', function(e) {
      updateLogFilter(e.target.value || '');
    });
    _logFilterInput?.addEventListener('wa-clear', function() {
      updateLogFilter('');
    });

    // Cancel HTMX request for latest.log — WebSocket handles the content.
    // For other log files, disconnect WebSocket and let HTMX load.
    document.body.addEventListener('htmx:configRequest', function(e) {
      if (!e.detail.elt || !e.detail.elt.closest('.log-files-list')) return;
      if (e.detail.elt.hasAttribute('data-ws-latest')) {
        e.preventDefault();
        _viewingLatest = true;
        connectLogWs();
        document.querySelectorAll('.log-files-list a').forEach(a => a.classList.remove('active'));
        e.detail.elt.classList.add('active');
      } else {
        _viewingLatest = false;
        disconnectLogWs();
        // Highlight the selected older log file in the sidebar.
        document.querySelectorAll('.log-files-list a').forEach(a => a.classList.remove('active'));
        e.detail.elt.classList.add('active');
      }
    });

    // Preserve scroll when HTMX swaps in a static log file.
    document.body.addEventListener('htmx:beforeSwap', function(e) {
      if (e.detail.target?.id === 'content') {
        disconnectLogWs();
      }
      if (e.detail.target?.id === 'log-content') {
        saveLogScroll();
      }
    });

    htmx.on('htmx:afterSettle', function() {
      highlightLogs();
      restoreLogScroll();
    });

    if (_viewingLatest) {
      connectLogWs();
    } else {
      highlightLogs();
    }
  </script>
</div>

<pre th:fragment="log-content"
     id="log-content"
     class="language-log"
     th:hx-get="${isLatest}
       ? '/logs/content?serverId=' + ${serverId}
       : '/logs/file?serverId=' + ${serverId} + '&amp;path=' + ${#uris.escapeQueryParam(logPath)}"
     th:hx-vals='|{"filter": "${filter}"}|'
     hx-trigger="updateFilter"
     hx-swap="outerHTML"
     th:text="${logContent}"></pre>
</body>
</html>
