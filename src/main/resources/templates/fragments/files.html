<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div th:if="${profile == null}" class="empty-state">No server selected.</div>

  <div th:if="${profile != null}" class="split" style="height: calc(100vh - 120px);">
    <div class="split-left file-tree">
      <wa-tree selection="leaf">
        <th:block th:each="entry : ${entries}">
          <wa-tree-item th:if="${entry.directory()}"
                        lazy
                        th:hx-get="'/files/list?serverId=' + ${serverId} + '&amp;path=' + ${entry.path()}"
                        hx-trigger="wa-lazy-load"
                        hx-target="this"
                        hx-swap="beforeend"
                        hx-on:htmx:afterRequest="this.removeAttribute('lazy')">
            <wa-icon name="folder" slot="expand-icon"></wa-icon>
            <span th:text="${entry.name()}"></span>
          </wa-tree-item>
          <wa-tree-item th:unless="${entry.directory()}"
                        th:hx-get="'/files/open?serverId=' + ${serverId} + '&amp;path=' + ${entry.path()}"
                        hx-target="#editor-pane"
                        hx-swap="outerHTML"
                        hx-trigger="click">
            <wa-icon name="file" slot="expand-icon"></wa-icon>
            <span th:text="${entry.name()}"></span>
          </wa-tree-item>
        </th:block>
      </wa-tree>
    </div>
    <div class="split-right">
      <div id="editor-pane" class="editor-pane">
        <div class="empty-state">Select a file to view or edit.</div>
      </div>
    </div>
  </div>
</div>

<th:block th:fragment="file-children">
  <th:block th:each="entry : ${entries}">
    <wa-tree-item th:if="${entry.directory()}"
                  lazy
                  th:hx-get="'/files/list?serverId=' + ${serverId} + '&amp;path=' + ${entry.path()}"
                  hx-trigger="wa-lazy-load"
                  hx-target="this"
                  hx-swap="beforeend"
                  hx-on:htmx:afterRequest="this.removeAttribute('lazy')">
      <wa-icon name="folder" slot="expand-icon"></wa-icon>
      <span th:text="${entry.name()}"></span>
    </wa-tree-item>
    <wa-tree-item th:unless="${entry.directory()}"
                  th:hx-get="'/files/open?serverId=' + ${serverId} + '&amp;path=' + ${entry.path()}"
                  hx-target="#editor-pane"
                  hx-swap="outerHTML"
                  hx-trigger="click">
      <wa-icon name="file" slot="expand-icon"></wa-icon>
      <span th:text="${entry.name()}"></span>
    </wa-tree-item>
  </th:block>
</th:block>

<div th:fragment="editor" class="editor-pane">
  <div th:if="${isBinary}">
    <div class="editor-toolbar">
      <span class="editor-path" th:text="${openPath}"></span>
      <wa-button size="small"
                 th:attr="href='/files/download?serverId=' + ${serverId} + '&amp;path=' + ${openPath}">
        <wa-icon slot="prefix" name="download"></wa-icon>
        Download
      </wa-button>
    </div>
    <div class="empty-state">Binary file — download to view.</div>
  </div>

  <div th:unless="${isBinary}">
    <wa-alert th:if="${saved}" variant="success" open style="margin-bottom: 8px;">
      <wa-icon slot="icon" name="circle-check"></wa-icon>
      Saved.
    </wa-alert>
    <form th:if="${fileContent != null}"
          hx-post="/files/save"
          hx-target="#editor-pane"
          hx-swap="outerHTML">
      <input type="hidden" name="serverId" th:value="${serverId}">
      <input type="hidden" name="path" th:value="${openPath}">
      <div class="editor-toolbar">
        <span class="editor-path" th:text="${openPath}"></span>
        <wa-button size="small" variant="primary" type="submit">
          <wa-icon slot="prefix" name="floppy-disk"></wa-icon>
          Save
        </wa-button>
        <wa-button size="small"
                   th:attr="href='/files/download?serverId=' + ${serverId} + '&amp;path=' + ${openPath}">
          <wa-icon slot="prefix" name="download"></wa-icon>
          Download
        </wa-button>
      </div>
      <textarea name="content" class="editor" th:text="${fileContent}"></textarea>
    </form>
    <div th:if="${fileContent == null}" class="empty-state">Select a file to view or edit.</div>
  </div>
</div>
</body>
</html>
