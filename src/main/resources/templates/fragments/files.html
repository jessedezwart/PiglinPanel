<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div th:if="${profile == null}" class="empty-state">No server selected.</div>

  <div th:if="${profile != null}" class="split">
    <div class="split-left file-tree">
      <ul>
        <th:block th:each="entry : ${entries}">
          <li th:if="${entry.directory()}">
            <details th:hx-get="'/files/list?serverId=' + ${serverId} + '&amp;path=' + ${entry.path()}"
                     hx-trigger="toggle[this.open] once"
                     hx-target="find ul"
                     hx-swap="innerHTML">
              <summary>
                <span th:text="${entry.name()}"></span>
              </summary>
              <ul></ul>
            </details>
          </li>
          <li th:unless="${entry.directory()}">
            <div class="file-entry"
                 th:hx-get="'/files/open?serverId=' + ${serverId} + '&amp;path=' + ${entry.path()}"
                 hx-target="#editor-pane"
                 hx-swap="outerHTML"
                 hx-trigger="click">
              <span th:text="${entry.name()}"></span>
            </div>
          </li>
        </th:block>
      </ul>
    </div>
    <div class="split-right">
      <div id="editor-pane" class="editor-pane">
        <div class="empty-state">Select a file to view or edit.</div>
      </div>
    </div>
  </div>
</div>

<th:block th:fragment="file-children">
  <th:block th:each="entry : ${entries}">
    <li th:if="${entry.directory()}">
      <details th:hx-get="'/files/list?serverId=' + ${serverId} + '&amp;path=' + ${entry.path()}"
               hx-trigger="toggle[this.open] once"
               hx-target="find ul"
               hx-swap="innerHTML">
        <summary>
          <span th:text="${entry.name()}"></span>
        </summary>
        <ul></ul>
      </details>
    </li>
    <li th:unless="${entry.directory()}">
      <div class="file-entry"
           th:hx-get="'/files/open?serverId=' + ${serverId} + '&amp;path=' + ${entry.path()}"
           hx-target="#editor-pane"
           hx-swap="outerHTML"
           hx-trigger="click">
        <span th:text="${entry.name()}"></span>
      </div>
    </li>
  </th:block>
</th:block>

<div th:fragment="editor" id="editor-pane" class="editor-pane">
  <div th:if="${isBinary}">
    <div class="editor-toolbar">
      <span class="editor-path" th:text="${openPath}"></span>
      <wa-button size="small"
                 th:attr="href='/files/download?serverId=' + ${serverId} + '&amp;path=' + ${openPath}">
        <wa-icon slot="prefix" name="download"></wa-icon>
        Download
      </wa-button>
    </div>
    <div class="empty-state">Binary file — download to view.</div>
  </div>

  <div th:unless="${isBinary}" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
    <wa-alert th:if="${saved}" variant="success" open style="margin-bottom: 8px; flex-shrink: 0;">
      <wa-icon slot="icon" name="circle-check"></wa-icon>
      Saved.
    </wa-alert>

    <div th:if="${fileContent != null}" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
      <!-- View mode -->
      <div id="file-view" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
        <div class="editor-toolbar">
          <span class="editor-path" th:text="${openPath}"></span>
          <wa-button th:unless="${isNbt}" size="small" onclick="enableFileEdit()">
            <wa-icon slot="prefix" name="pen"></wa-icon>
            Edit
          </wa-button>
          <wa-button size="small"
                     th:attr="href='/files/download?serverId=' + ${serverId} + '&amp;path=' + ${openPath}">
            <wa-icon slot="prefix" name="download"></wa-icon>
            Download
          </wa-button>
        </div>
        <pre class="code-view"><code th:class="'language-' + ${lang}" th:text="${fileContent}"></code></pre>
      </div>

      <!-- Edit mode (hidden by default, not shown for NBT files) -->
      <form th:unless="${isNbt}" id="file-edit"
            style="display: none; flex-direction: column; flex: 1; min-height: 0;"
            hx-post="/files/save"
            hx-target="#editor-pane"
            hx-swap="outerHTML">
        <input type="hidden" name="serverId" th:value="${serverId}">
        <input type="hidden" name="path" th:value="${openPath}">
        <div class="editor-toolbar">
          <span class="editor-path" th:text="${openPath}"></span>
          <wa-button size="small" variant="primary" type="submit">
            <wa-icon slot="prefix" name="floppy-disk"></wa-icon>
            Save
          </wa-button>
          <wa-button size="small" type="button" onclick="disableFileEdit()">
            <wa-icon slot="prefix" name="xmark"></wa-icon>
            Cancel
          </wa-button>
          <wa-button size="small"
                     th:attr="href='/files/download?serverId=' + ${serverId} + '&amp;path=' + ${openPath}">
            <wa-icon slot="prefix" name="download"></wa-icon>
            Download
          </wa-button>
        </div>
        <textarea name="content" class="editor" th:text="${fileContent}"></textarea>
      </form>
    </div>

    <div th:if="${fileContent == null}" class="empty-state">Select a file to view or edit.</div>
  </div>

  <script>
    (function () {
      var code = document.querySelector('#editor-pane code');
      if (code && typeof hljs !== 'undefined') {
        hljs.highlightElement(code);
      }
    })();

    function enableFileEdit() {
      document.getElementById('file-view').style.display = 'none';
      document.getElementById('file-edit').style.display = 'flex';
    }

    function disableFileEdit() {
      document.getElementById('file-view').style.display = 'flex';
      document.getElementById('file-edit').style.display = 'none';
    }
  </script>
</div>
</body>
</html>
