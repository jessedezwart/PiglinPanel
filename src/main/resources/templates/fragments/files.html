<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div th:if="${profile == null}" class="empty-state">No server selected.</div>

  <div th:if="${profile != null}" class="split" style="height: calc(100vh - 120px);">
    <div class="split-left file-tree">
      <ul>
        <li th:each="entry : ${entries}">
          <div th:if="${entry.directory()}"
               class="file-entry"
               th:hx-get="'/files/list?serverId=' + ${serverId} + '&amp;path=' + ${entry.path()}"
               hx-target="next ul"
               hx-swap="innerHTML">
            <i class="icon">&#128193;</i>
            <span th:text="${entry.name()}"></span>
            <ul></ul>
          </div>
          <div th:unless="${entry.directory()}"
               class="file-entry"
               th:hx-get="'/files/open?serverId=' + ${serverId} + '&amp;path=' + ${entry.path()}"
               hx-target="#editor-pane"
               hx-swap="innerHTML">
            <i class="icon">&#128196;</i>
            <span th:text="${entry.name()}"></span>
          </div>
        </li>
      </ul>
    </div>
    <div class="split-right">
      <div id="editor-pane" class="editor-pane">
        <div class="empty-state">Select a file to view or edit.</div>
      </div>
    </div>
  </div>
</div>

<ul th:fragment="file-children">
  <li th:each="entry : ${entries}">
    <div th:if="${entry.directory()}"
         class="file-entry"
         th:hx-get="'/files/list?serverId=' + ${serverId} + '&amp;path=' + ${entry.path()}"
         hx-target="next ul"
         hx-swap="innerHTML">
      <i class="icon">&#128193;</i>
      <span th:text="${entry.name()}"></span>
      <ul></ul>
    </div>
    <div th:unless="${entry.directory()}"
         class="file-entry"
         th:hx-get="'/files/open?serverId=' + ${serverId} + '&amp;path=' + ${entry.path()}"
         hx-target="#editor-pane"
         hx-swap="innerHTML">
      <i class="icon">&#128196;</i>
      <span th:text="${entry.name()}"></span>
    </div>
  </li>
</ul>

<div th:fragment="editor" class="editor-pane">
  <div th:if="${isBinary}">
    <div class="editor-toolbar">
      <span class="editor-path" th:text="${openPath}"></span>
      <a class="btn btn-sm"
         th:href="'/files/download?serverId=' + ${serverId} + '&amp;path=' + ${openPath}">
        Download
      </a>
    </div>
    <div class="empty-state">Binary file — download to view.</div>
  </div>

  <div th:unless="${isBinary}">
    <div th:if="${saved}" class="error-banner" style="background: rgba(76,175,80,0.15); border-color: var(--success); color: #a5d6a7;">
      Saved.
    </div>
    <form th:if="${fileContent != null}"
          hx-post="/files/save"
          hx-target="#editor-pane"
          hx-swap="outerHTML">
      <input type="hidden" name="serverId" th:value="${serverId}">
      <input type="hidden" name="path" th:value="${openPath}">
      <div class="editor-toolbar">
        <span class="editor-path" th:text="${openPath}"></span>
        <button type="submit" class="btn btn-sm btn-primary">Save</button>
        <a class="btn btn-sm"
           th:href="'/files/download?serverId=' + ${serverId} + '&amp;path=' + ${openPath}">
          Download
        </a>
      </div>
      <textarea name="content" class="editor" th:text="${fileContent}"></textarea>
    </form>
    <div th:if="${fileContent == null}" class="empty-state">Select a file to view or edit.</div>
  </div>
</div>
</body>
</html>
