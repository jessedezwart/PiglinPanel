<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<wa-dialog th:fragment="form"
           th:attr="label=${isNew} ? 'Add Server' : 'Edit Server'"
           style="--width: 580px;">

  <form id="server-form" class="server-form"
        hx-post="/servers"
        hx-target="body"
        hx-swap="outerHTML">

    <input type="hidden" name="id" th:value="${editProfile.id}">

    <wa-input label="Server Name" name="name" th:value="${editProfile.name}" required></wa-input>

    <wa-select label="Access Type" name="accessType" th:value="${editProfile.accessType.name()}">
      <wa-option value="LOCAL">Local</wa-option>
      <wa-option value="SSH">SSH</wa-option>
    </wa-select>

    <wa-input label="Root Path" name="rootPath" th:value="${editProfile.rootPath}" placeholder="/path/to/server"></wa-input>

    <wa-input label="Logs Path (relative to root)" name="logsPath" th:value="${editProfile.logsPath}" placeholder="logs"></wa-input>

    <wa-textarea label="Mod Folders (one per line)" name="modFoldersText"
                 rows="4" th:value="${modFoldersText}" placeholder="mods"></wa-textarea>

    <wa-divider></wa-divider>
    <p class="form-section-title">SSH</p>

    <div class="form-row">
      <wa-input label="Host" name="sshHost" th:value="${editProfile.ssh.host}"></wa-input>
      <wa-input label="Port" name="sshPort" type="number" th:value="${editProfile.ssh.port}" style="width:110px; flex:none;"></wa-input>
    </div>

    <wa-input label="Username" name="sshUsername" th:value="${editProfile.ssh.username}"></wa-input>

    <wa-input label="Password" name="sshPassword" type="password"
              th:value="${editProfile.ssh.password}" autocomplete="new-password"></wa-input>

    <wa-input label="Private Key Path" name="sshPrivateKeyPath"
              th:value="${editProfile.ssh.privateKeyPath}" placeholder="/home/user/.ssh/id_rsa"></wa-input>

    <wa-input label="Private Key Passphrase" name="sshPrivateKeyPassphrase" type="password"
              th:value="${editProfile.ssh.privateKeyPassphrase}" autocomplete="new-password"></wa-input>

    <wa-divider></wa-divider>
    <p class="form-section-title">RCON</p>

    <wa-checkbox name="rconEnabled" value="true" th:checked="${editProfile.rcon.enabled}">Enable RCON</wa-checkbox>

    <div class="form-row">
      <wa-input label="RCON Host" name="rconHost" th:value="${editProfile.rcon.host}"></wa-input>
      <wa-input label="Port" name="rconPort" type="number" th:value="${editProfile.rcon.port}" style="width:110px; flex:none;"></wa-input>
    </div>

    <wa-input label="RCON Password" name="rconPassword" type="password"
              th:value="${editProfile.rcon.password}" autocomplete="new-password"></wa-input>
  </form>

  <div slot="footer" style="display:flex; gap:8px; justify-content:flex-end;">
    <wa-button onclick="this.closest('wa-dialog').hide()">
      <wa-icon slot="prefix" name="xmark"></wa-icon>
      Cancel
    </wa-button>
    <wa-button variant="primary" type="submit" form="server-form">
      <wa-icon slot="prefix" name="floppy-disk"></wa-icon>
      <span th:text="${isNew} ? 'Add Server' : 'Save Changes'"></span>
    </wa-button>
  </div>
</wa-dialog>
</body>
</html>
