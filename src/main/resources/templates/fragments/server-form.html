<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<sl-dialog th:fragment="form"
           th:attr="label=${isNew} ? 'Add Server' : 'Edit Server'"
           style="--width: 580px;">

  <form id="server-form" class="server-form"
        hx-post="/servers"
        hx-target="body"
        hx-swap="outerHTML">

    <input type="hidden" name="id" th:value="${editProfile.id}">

    <sl-input label="Server Name" name="name" th:value="${editProfile.name}" required></sl-input>

    <sl-select label="Access Type" name="accessType" th:value="${editProfile.accessType.name()}">
      <sl-option value="LOCAL">Local</sl-option>
      <sl-option value="SSH">SSH</sl-option>
    </sl-select>

    <sl-input label="Root Path" name="rootPath" th:value="${editProfile.rootPath}" placeholder="/path/to/server"></sl-input>

    <sl-input label="Logs Path (relative to root)" name="logsPath" th:value="${editProfile.logsPath}" placeholder="logs"></sl-input>

    <sl-textarea label="Mod Folders (one per line)" name="modFoldersText"
                 rows="4" th:value="${modFoldersText}" placeholder="mods"></sl-textarea>

    <sl-divider></sl-divider>
    <p class="form-section-title">SSH</p>

    <div class="form-row">
      <sl-input label="Host" name="sshHost" th:value="${editProfile.ssh.host}"></sl-input>
      <sl-input label="Port" name="sshPort" type="number" th:value="${editProfile.ssh.port}" style="width:110px; flex:none;"></sl-input>
    </div>

    <sl-input label="Username" name="sshUsername" th:value="${editProfile.ssh.username}"></sl-input>

    <sl-input label="Password" name="sshPassword" type="password"
              th:value="${editProfile.ssh.password}" autocomplete="new-password"></sl-input>

    <sl-input label="Private Key Path" name="sshPrivateKeyPath"
              th:value="${editProfile.ssh.privateKeyPath}" placeholder="/home/user/.ssh/id_rsa"></sl-input>

    <sl-input label="Private Key Passphrase" name="sshPrivateKeyPassphrase" type="password"
              th:value="${editProfile.ssh.privateKeyPassphrase}" autocomplete="new-password"></sl-input>

    <sl-divider></sl-divider>
    <p class="form-section-title">RCON</p>

    <sl-checkbox name="rconEnabled" value="true" th:checked="${editProfile.rcon.enabled}">Enable RCON</sl-checkbox>

    <div class="form-row">
      <sl-input label="RCON Host" name="rconHost" th:value="${editProfile.rcon.host}"></sl-input>
      <sl-input label="Port" name="rconPort" type="number" th:value="${editProfile.rcon.port}" style="width:110px; flex:none;"></sl-input>
    </div>

    <sl-input label="RCON Password" name="rconPassword" type="password"
              th:value="${editProfile.rcon.password}" autocomplete="new-password"></sl-input>
  </form>

  <div slot="footer" style="display:flex; gap:8px; justify-content:flex-end;">
    <sl-button onclick="this.closest('sl-dialog').hide()">Cancel</sl-button>
    <sl-button variant="primary" type="submit" form="server-form"
               th:text="${isNew} ? 'Add Server' : 'Save Changes'"></sl-button>
  </div>
</sl-dialog>
</body>
</html>
