<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div th:if="${profile == null}" class="empty-state">No server selected.</div>

  <div th:if="${profile != null}">
    <input type="hidden" id="mods-server-id" name="serverId" th:value="${serverId}">
    <input type="hidden" id="mods-folder-id" name="folderId"
           th:value="${not #lists.isEmpty(profile.modFolders) ? profile.modFolders[0].id : ''}">

    <div th:if="${updatesLoaded == false}" id="mods-loader"
         th:data-stream="@{/mods/check-updates/stream(serverId=${serverId}, force=${force})}"
         style="margin-bottom: 0.75rem; display:flex; align-items:center; gap:0.6rem;">
      <wa-spinner style="--size: 16px; --track-width: 2px;"></wa-spinner>
      <wa-progress-bar id="mods-progress-bar" value="0" style="flex:0 0 180px;"></wa-progress-bar>
      <span id="mods-progress-label" style="color: var(--text-dim); font-size: 0.85rem;">Checking for updates…</span>
    </div>

    <div class="toolbar">
      <wa-button size="small" variant="primary"
                 hx-get="/mods?force=true"
                 hx-include="#mods-server-id"
                 hx-target="#content"
                 hx-swap="innerHTML">
        <wa-icon slot="start" name="arrows-rotate"></wa-icon>
        Check updates
      </wa-button>

      <wa-button size="small" id="upload-mod-btn">
        <wa-icon slot="start" name="upload"></wa-icon>
        Upload mod
      </wa-button>
      <input id="mod-upload-input" type="file" accept=".jar" style="display:none"
             hx-post="/mods/upload"
             hx-encoding="multipart/form-data"
             hx-include="#mods-server-id, #mods-folder-id"
             hx-target="#content"
             hx-swap="innerHTML"
             name="file">

      <wa-button th:if="${groups != null and not #lists.isEmpty(groups)}"
                 id="btn-delete" size="small" variant="danger" disabled
                 hx-post="/mods/delete"
                 hx-include="#mods-form"
                 hx-confirm="Delete selected mods?"
                 hx-target="#content"
                 hx-swap="innerHTML">
        <wa-icon slot="start" name="trash"></wa-icon>
        Delete selected
      </wa-button>
      <wa-button th:if="${groups != null and not #lists.isEmpty(groups)}"
                 id="btn-update" size="small" variant="success" disabled
                 hx-post="/mods/update"
                 hx-include="#mods-form"
                 hx-confirm="Update selected mods?"
                 hx-target="#content"
                 hx-swap="innerHTML">
        <wa-icon slot="start" name="cloud-arrow-down"></wa-icon>
        Update selected
      </wa-button>
    </div>

    <div th:if="${groups == null or #lists.isEmpty(groups)}" class="empty-state">No mods found.</div>

    <form id="mods-form" th:if="${groups != null and not #lists.isEmpty(groups)}">
      <input type="hidden" name="serverId" th:value="${serverId}">

      <div th:with="availableUpdates=${groups.?[update != null and update.available()]}"
           th:if="${not #lists.isEmpty(availableUpdates)}"
           style="margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem;">
        <wa-icon name="circle-exclamation" style="color: var(--wa-color-warning-600);"></wa-icon>
        <span th:text="${#lists.size(availableUpdates)} + ' mod(s) have updates available'"></span>
      </div>

      <table>
        <thead>
          <tr>
            <th style="width:32px"><input id="cb-select-all" type="checkbox" title="Select all"></th>
            <th style="width:24px"></th>
            <th style="width:28px"></th>
            <th>File</th>
            <th>Folder</th>
            <th>Size</th>
            <th>Client</th>
            <th>Server</th>
            <th>Downloads</th>
            <th>Update</th>
          </tr>
        </thead>
        <tbody>
          <th:block th:each="group, gstat : ${groups}">
            <!-- Active version row (or placeholder when every version is disabled) -->
            <tr th:with="active=${group.active}">
              <td>
                <input th:if="${active != null}" class="mod-checkbox" type="checkbox"
                       name="modPaths" th:value="${active.relativePath}">
              </td>
              <td style="padding:0 4px;text-align:center;">
                <button th:if="${group.hasArchived()}" type="button" class="group-toggle"
                        th:attr="data-group=${gstat.index}"
                        title="Show previous versions"
                        style="background:none;border:none;cursor:pointer;color:var(--text-dim);padding:4px;display:inline-flex;align-items:center;">
                  <wa-icon class="chev" name="chevron-right"></wa-icon>
                </button>
              </td>
              <td style="padding: 0 4px;">
                <img th:if="${group.iconUrl != null}"
                     th:src="${group.iconUrl}"
                     width="24" height="24"
                     style="border-radius:4px;object-fit:cover;display:block;"
                     onerror="this.style.display='none'"
                     alt="">
              </td>
              <td>
                <span th:if="${group.hasArchived()}" class="group-toggle"
                      th:attr="data-group=${gstat.index}"
                      style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
                  <span th:text="${active != null ? active.fileName : group.displayName}"></span>
                  <wa-badge th:if="${active == null}" variant="neutral">disabled</wa-badge>
                  <wa-badge variant="neutral" pill
                            th:text="${#lists.size(group.archived)} + ' version(s)'"></wa-badge>
                </span>
                <span th:unless="${group.hasArchived()}"
                      style="display:inline-flex;align-items:center;gap:6px;">
                  <span th:text="${active != null ? active.fileName : group.displayName}"></span>
                  <wa-badge th:if="${active == null}" variant="neutral">disabled</wa-badge>
                </span>
              </td>
              <td th:text="${group.folderName}"></td>
              <td th:text="${active != null ? #numbers.formatDecimal(active.size / 1024.0, 1, 1) + ' KB' : '—'}"></td>
              <td>
                <wa-badge th:if="${group.update != null and group.update.clientSide() != null and group.update.clientSide() != 'unknown'}"
                          th:variant="${group.update.clientSide() == 'required' ? 'brand' : (group.update.clientSide() == 'unsupported' ? 'danger' : 'neutral')}"
                          th:text="${group.update.clientSide()}"></wa-badge>
              </td>
              <td>
                <wa-badge th:if="${group.update != null and group.update.serverSide() != null and group.update.serverSide() != 'unknown'}"
                          th:variant="${group.update.serverSide() == 'required' ? 'brand' : (group.update.serverSide() == 'unsupported' ? 'danger' : 'neutral')}"
                          th:text="${group.update.serverSide()}"></wa-badge>
              </td>
              <td>
                <span th:if="${group.update != null and group.update.downloads() > 0}"
                      th:text="${group.update.formattedDownloads()}"
                      style="color: var(--text-dim); font-size: 0.85rem;"></span>
              </td>
              <td>
                <wa-badge th:if="${group.update != null and group.update.available()}"
                          variant="warning"
                          th:text="${group.update.latestVersionName()}"></wa-badge>
                <span th:if="${group.update != null and group.update.projectName() != null and not group.update.available()}"
                      style="color: var(--text-dim); font-size: 0.85rem;"
                      th:text="${group.update.projectName()}"></span>
                <span th:if="${active != null and group.update == null}"
                      style="color: var(--text-dim);">—</span>
              </td>
            </tr>
            <!-- Archived (disabled) versions, hidden until expanded -->
            <tr th:each="arch : ${group.archived}"
                class="archived-row" th:attr="data-group=${gstat.index}" style="display:none;">
              <td>
                <input class="mod-checkbox" type="checkbox" name="modPaths" th:value="${arch.relativePath}">
              </td>
              <td></td>
              <td></td>
              <td style="padding-left: 1.5rem;">
                <wa-icon name="clock-rotate-left" style="color: var(--text-dim);"></wa-icon>
                <span style="color: var(--text-dim);" th:text="${arch.fileName}"></span>
              </td>
              <td th:text="${arch.folderName}"></td>
              <td th:text="${#numbers.formatDecimal(arch.size / 1024.0, 1, 1) + ' KB'}"></td>
              <td></td>
              <td></td>
              <td></td>
              <td>
                <wa-button size="small" variant="neutral"
                           th:attr="hx-post=|/mods/activate?serverId=${#uris.escapeQueryParam(serverId)}&amp;modPath=${#uris.escapeQueryParam(arch.relativePath)}&amp;activePath=${group.active != null ? #uris.escapeQueryParam(group.active.relativePath) : ''}|"
                           hx-target="#content"
                           hx-swap="innerHTML">
                  <wa-icon slot="start" name="rotate-left"></wa-icon>
                  Activate
                </wa-button>
              </td>
            </tr>
          </th:block>
        </tbody>
      </table>
    </form>

    <script>
      (function () {
        const loader = document.getElementById('mods-loader');
        if (!loader || !loader.dataset.stream) return;
        const bar = document.getElementById('mods-progress-bar');
        const label = document.getElementById('mods-progress-label');
        const source = new EventSource(loader.dataset.stream);

        source.addEventListener('progress', function (event) {
          const data = JSON.parse(event.data);
          if (data.total > 0) {
            bar.value = Math.round((data.done / data.total) * 100);
          }
          if (data.phase === 'lookup') {
            label.textContent = 'Checking updates on Modrinth…';
          } else {
            label.textContent = 'Reading mods ' + data.done + '/' + data.total
              + (data.fileName ? ' — ' + data.fileName : '');
          }
        });

        source.addEventListener('done', function (event) {
          source.close();
          htmx.swap('#content', event.data, { swapStyle: 'innerHTML' });
        });

        source.onerror = function () {
          source.close();
          if (label) label.textContent = 'Could not check for updates.';
        };
      })();

      document.getElementById('upload-mod-btn')?.addEventListener('click', () => {
        document.getElementById('mod-upload-input').click();
      });

      (function () {
        const form = document.getElementById('mods-form');
        if (!form) return;
        const btnDelete = document.getElementById('btn-delete');
        const btnUpdate = document.getElementById('btn-update');
        const cbAll = document.getElementById('cb-select-all');

        function syncButtons() {
          const checkboxes = form.querySelectorAll('.mod-checkbox');
          const checked = form.querySelectorAll('.mod-checkbox:checked');
          const anyChecked = checked.length > 0;
          if (btnDelete) btnDelete.disabled = !anyChecked;
          if (btnUpdate) btnUpdate.disabled = !anyChecked;
          if (cbAll) {
            cbAll.checked = anyChecked && checked.length === checkboxes.length;
            cbAll.indeterminate = anyChecked && checked.length < checkboxes.length;
          }
        }

        form.addEventListener('change', function (e) {
          if (e.target.classList.contains('mod-checkbox')) syncButtons();
        });

        cbAll?.addEventListener('change', function () {
          form.querySelectorAll('.mod-checkbox').forEach(cb => cb.checked = cbAll.checked);
          syncButtons();
        });

        form.querySelectorAll('.group-toggle').forEach(function (toggle) {
          toggle.addEventListener('click', function () {
            const id = toggle.getAttribute('data-group');
            const rows = form.querySelectorAll('.archived-row[data-group="' + id + '"]');
            if (!rows.length) return;
            const expanded = rows[0].style.display !== 'none';
            rows.forEach(row => row.style.display = expanded ? 'none' : 'table-row');
            const chev = form.querySelector('button.group-toggle[data-group="' + id + '"] .chev');
            if (chev) chev.setAttribute('name', expanded ? 'chevron-right' : 'chevron-down');
          });
        });
      })();
    </script>
  </div>
</div>
</body>
</html>
