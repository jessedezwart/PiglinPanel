<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div th:if="${profile == null}" class="empty-state">No server selected.</div>

  <div th:if="${profile != null}">
    <input type="hidden" id="mods-server-id" name="serverId" th:value="${serverId}">
    <input type="hidden" id="mods-folder-id" name="folderId"
           th:value="${not #lists.isEmpty(profile.modFolders) ? profile.modFolders[0].id : ''}">

    <div th:if="${updatesLoaded == false}"
         hx-post="/mods/check-updates"
         hx-include="#mods-server-id"
         hx-target="#content"
         hx-swap="innerHTML"
         hx-trigger="load"
         hx-indicator="#mods-spinner"
         style="display:none"></div>

    <div class="toolbar">
      <wa-button size="small" variant="primary"
                 hx-post="/mods/check-updates"
                 hx-include="#mods-server-id"
                 hx-target="#content"
                 hx-swap="innerHTML"
                 hx-indicator="#mods-spinner"
                 hx-on:htmx:before-request="setModsDisabled(true)">
        <wa-icon slot="prefix" name="arrows-rotate"></wa-icon>
        Check updates
      </wa-button>
      <wa-spinner id="mods-spinner" class="htmx-indicator" style="--size: 16px; --track-width: 2px;"></wa-spinner>

      <wa-button size="small" id="upload-mod-btn">
        <wa-icon slot="prefix" name="upload"></wa-icon>
        Upload mod
      </wa-button>
      <input id="mod-upload-input" type="file" accept=".jar" style="display:none"
             hx-post="/mods/upload"
             hx-encoding="multipart/form-data"
             hx-include="#mods-server-id, #mods-folder-id"
             hx-target="#content"
             hx-swap="innerHTML"
             name="file">

      <wa-button th:if="${mods != null and not #lists.isEmpty(mods)}"
                 id="btn-delete" size="small" variant="danger" disabled
                 hx-post="/mods/delete"
                 hx-include="#mods-form"
                 hx-confirm="Delete selected mods?"
                 hx-target="#content"
                 hx-swap="innerHTML">
        <wa-icon slot="prefix" name="trash"></wa-icon>
        Delete selected
      </wa-button>
      <wa-button th:if="${mods != null and not #lists.isEmpty(mods)}"
                 id="btn-update" size="small" variant="success" disabled
                 hx-post="/mods/update"
                 hx-include="#mods-form"
                 hx-confirm="Update selected mods?"
                 hx-target="#content"
                 hx-swap="innerHTML">
        <wa-icon slot="prefix" name="cloud-arrow-down"></wa-icon>
        Update selected
      </wa-button>
    </div>

    <div th:if="${mods == null or #lists.isEmpty(mods)}" class="empty-state">No mods found.</div>

    <form id="mods-form" th:if="${mods != null and not #lists.isEmpty(mods)}">
      <input type="hidden" name="serverId" th:value="${serverId}">

      <div th:with="availableUpdates=${mods.?[update != null &amp;&amp; update.available()]}"
           th:if="${not #lists.isEmpty(availableUpdates)}"
           style="margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem;">
        <wa-icon name="circle-exclamation" style="color: var(--wa-color-warning-600);"></wa-icon>
        <span th:text="${#lists.size(availableUpdates)} + ' mod(s) have updates available'"></span>
      </div>

      <table>
        <thead>
          <tr>
            <th style="width:32px"><input id="cb-select-all" type="checkbox" title="Select all"></th>
            <th style="width:28px"></th>
            <th>File</th>
            <th>Folder</th>
            <th>Size</th>
            <th>Client</th>
            <th>Server</th>
            <th>Downloads</th>
            <th>Update</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="modFile : ${mods}">
            <td><input class="mod-checkbox" type="checkbox" name="modPaths" th:value="${modFile.relativePath}"></td>
            <td style="padding: 0 4px;">
              <img th:if="${modFile.update != null and modFile.update.iconUrl() != null}"
                   th:src="${modFile.update.iconUrl()}"
                   width="24" height="24"
                   style="border-radius:4px;object-fit:cover;display:block;"
                   onerror="this.style.display='none'"
                   alt="">
            </td>
            <td>
              <span th:text="${modFile.fileName}"></span>
              <wa-badge th:if="${modFile.archived}" variant="neutral">archived</wa-badge>
            </td>
            <td th:text="${modFile.folderName}"></td>
            <td th:text="${#numbers.formatDecimal(modFile.size / 1024.0, 1, 1) + ' KB'}"></td>
            <td>
              <wa-badge th:if="${modFile.update != null and modFile.update.clientSide() != null and modFile.update.clientSide() != 'unknown'}"
                        th:variant="${modFile.update.clientSide() == 'required' ? 'brand' : (modFile.update.clientSide() == 'unsupported' ? 'danger' : 'neutral')}"
                        th:text="${modFile.update.clientSide()}"></wa-badge>
            </td>
            <td>
              <wa-badge th:if="${modFile.update != null and modFile.update.serverSide() != null and modFile.update.serverSide() != 'unknown'}"
                        th:variant="${modFile.update.serverSide() == 'required' ? 'brand' : (modFile.update.serverSide() == 'unsupported' ? 'danger' : 'neutral')}"
                        th:text="${modFile.update.serverSide()}"></wa-badge>
            </td>
            <td>
              <span th:if="${modFile.update != null and modFile.update.downloads() > 0}"
                    th:text="${modFile.update.formattedDownloads()}"
                    style="color: var(--text-dim); font-size: 0.85rem;"></span>
            </td>
            <td>
              <wa-badge th:if="${modFile.update != null and modFile.update.available()}"
                        variant="warning"
                        th:text="${modFile.update.latestVersionName()}"></wa-badge>
              <span th:if="${modFile.update != null and modFile.update.projectName() != null and not modFile.update.available()}"
                    style="color: var(--text-dim); font-size: 0.85rem;"
                    th:text="${modFile.update.projectName()}"></span>
              <span th:if="${modFile.update == null}"
                    style="color: var(--text-dim);">—</span>
            </td>
          </tr>
        </tbody>
      </table>
    </form>

    <script>
      document.getElementById('upload-mod-btn')?.addEventListener('click', () => {
        document.getElementById('mod-upload-input').click();
      });

      function setModsDisabled(disabled) {
        document.querySelectorAll('.toolbar wa-button, #mods-form input').forEach(el => {
          el.disabled = disabled;
        });
      }

      (function () {
        const form = document.getElementById('mods-form');
        if (!form) return;
        const btnDelete = document.getElementById('btn-delete');
        const btnUpdate = document.getElementById('btn-update');
        const cbAll = document.getElementById('cb-select-all');

        function syncButtons() {
          const checkboxes = form.querySelectorAll('.mod-checkbox');
          const checked = form.querySelectorAll('.mod-checkbox:checked');
          const anyChecked = checked.length > 0;
          if (btnDelete) btnDelete.disabled = !anyChecked;
          if (btnUpdate) btnUpdate.disabled = !anyChecked;
          if (cbAll) {
            cbAll.checked = anyChecked && checked.length === checkboxes.length;
            cbAll.indeterminate = anyChecked && checked.length < checkboxes.length;
          }
        }

        form.addEventListener('change', function (e) {
          if (e.target.classList.contains('mod-checkbox')) syncButtons();
        });

        cbAll?.addEventListener('change', function () {
          form.querySelectorAll('.mod-checkbox').forEach(cb => cb.checked = cbAll.checked);
          syncButtons();
        });
      })();
    </script>
  </div>
</div>
</body>
</html>
