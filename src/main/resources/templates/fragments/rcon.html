<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div th:if="${profile == null}" class="empty-state">No server selected.</div>

  <div th:if="${profile != null}" class="rcon-layout">
    <div th:replace="~{fragments/rcon :: log-content}"></div>

    <div th:if="${not profile.rcon.enabled}" class="rcon-disabled-bar">
      <span>RCON is not enabled for this server &mdash; the command bar is read-only.</span>
      <wa-button size="small" variant="primary"
                 hx-get="/servers/edit-form"
                 th:hx-vals='|{"serverId": "${serverId}"}|'
                 hx-target="#modal"
                 hx-swap="innerHTML">
        <wa-icon slot="start" name="bolt"></wa-icon>
        Activate RCON
      </wa-button>
    </div>

    <form th:if="${profile.rcon.enabled}"
          hx-post="/rcon/command"
          hx-target="#rcon-error"
          hx-swap="innerHTML"
          hx-on::after-request="this.reset()">
      <input type="hidden" name="serverId" th:value="${serverId}">
      <div class="rcon-input">
        <wa-input name="command" placeholder="Enter command..." autofocus autocomplete="off"></wa-input>
        <wa-button variant="primary" type="submit">
          Send
          <wa-icon slot="end" name="paper-plane"></wa-icon>
        </wa-button>
      </div>
    </form>

    <div th:unless="${profile.rcon.enabled}" class="rcon-input">
      <wa-input placeholder="Activate RCON to send commands..." disabled autocomplete="off"></wa-input>
      <wa-button variant="primary" disabled>
        Send
        <wa-icon slot="end" name="paper-plane"></wa-icon>
      </wa-button>
    </div>

    <div id="rcon-error"></div>
  </div>
</div>

<pre th:fragment="log-content"
     id="rcon-log"
     th:hx-get="'/rcon/log?serverId=' + ${serverId}"
     hx-trigger="every 2s"
     hx-swap="outerHTML"
     th:text="${logContent}"></pre>

<span th:fragment="command-ok"></span>

<wa-alert th:fragment="command-error" variant="danger" open>
  <wa-icon slot="icon" name="circle-exclamation"></wa-icon>
  <span th:text="${errorMessage}"></span>
</wa-alert>
</body>
</html>
