<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piglin Panel</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.0.0/dist-cdn/styles/themes/default.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.0.0/dist-cdn/webawesome.loader.js"></script>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/atom-one-light.min.css">
</head>
<body>

<header class="topbar">
  <span class="app-name">Piglin Panel</span>

  <div class="server-selector">
    <wa-select id="server-select" size="small" th:if="${not #lists.isEmpty(servers)}" th:value="${serverId}">
      <wa-option th:each="s : ${servers}" th:value="${s.id}" th:text="${s.name}"></wa-option>
    </wa-select>
    <span th:if="${#lists.isEmpty(servers)}" class="no-servers">No servers</span>
  </div>

  <div class="server-actions">
    <wa-button size="small"
               hx-get="/servers/new-form"
               hx-target="#modal"
               hx-swap="innerHTML">
      <wa-icon slot="start" name="plus"></wa-icon>
      Add server
    </wa-button>
    <wa-button size="small" variant="neutral"
               th:if="${profile != null}"
               hx-get="/servers/edit-form"
               hx-vals='js:{"serverId": document.getElementById("server-select") ? document.getElementById("server-select").value : ""}'
               hx-target="#modal"
               hx-swap="innerHTML">
      <wa-icon slot="start" name="pen"></wa-icon>
      Edit
    </wa-button>
    <wa-button size="small" variant="danger"
               th:if="${profile != null}"
               hx-post="/servers/__${profile.id}__/delete"
               hx-confirm="Delete this server?"
               hx-vals='js:{"serverId": document.getElementById("server-select") ? document.getElementById("server-select").value : ""}'>
      <wa-icon slot="start" name="trash"></wa-icon>
      Delete
    </wa-button>
  </div>
</header>

<div class="app-body">
  <nav class="sidebar">
    <a class="nav-link" th:classappend="${currentView == 'overview'} ? ' active'"
       hx-get="/overview" hx-target="#content" hx-push-url="true"
       hx-vals='js:{"serverId": currentServerId()}'>
      <wa-icon name="gauge-high"></wa-icon><span>Overview</span></a>
    <a class="nav-link" th:classappend="${currentView == 'mods'} ? ' active'"
       hx-get="/mods" hx-target="#content" hx-push-url="true"
       hx-vals='js:{"serverId": currentServerId()}'>
      <wa-icon name="puzzle-piece"></wa-icon><span>Mods</span></a>
    <a class="nav-link" th:classappend="${currentView == 'logs'} ? ' active'"
       hx-get="/logs" hx-target="#content" hx-push-url="true"
       hx-vals='js:{"serverId": currentServerId()}'>
      <wa-icon name="file-lines"></wa-icon><span>Logs</span></a>
    <a class="nav-link" th:classappend="${currentView == 'files'} ? ' active'"
       hx-get="/files" hx-target="#content" hx-push-url="true"
       hx-vals='js:{"serverId": currentServerId()}'>
      <wa-icon name="folder-tree"></wa-icon><span>Files</span></a>
    <a class="nav-link" th:if="${profile != null}"
       th:classappend="${currentView == 'rcon'} ? ' active'"
       hx-get="/rcon" hx-target="#content" hx-push-url="true"
       hx-vals='js:{"serverId": currentServerId()}'>
      <wa-icon name="terminal"></wa-icon><span>CLI</span></a>
  </nav>

  <main id="content">
    <div th:replace="~{__${contentFragment}__}"></div>
  </main>
</div>

<footer id="panel-console" class="panel-console">
  <div class="panel-console-header" onclick="togglePanelConsole()">
    <wa-icon name="terminal"></wa-icon>
    <span class="panel-console-title">Panel Console</span>
    <wa-icon class="panel-console-chevron" name="chevron-down"></wa-icon>
  </div>
  <pre id="panel-console-output" class="panel-console-output language-log"></pre>
</footer>

<div id="backend-toast" class="backend-toast" hidden>
  <wa-icon name="triangle-exclamation"></wa-icon>
  <span>Connection to backend lost. Retrying&hellip;</span>
</div>

<div id="modal"></div>

<script th:inline="javascript">
  const _serverId = /*[[${serverId}]]*/ '';

  function currentServerId() {
    const sel = document.getElementById('server-select');
    return sel ? sel.value : _serverId;
  }

  const serverSelect = document.getElementById('server-select');
  if (serverSelect) {
    serverSelect.addEventListener('wa-change', function () {
      window.location.href = '/servers/select?serverId=' + encodeURIComponent(this.value);
    });
  }

  document.body.addEventListener('htmx:pushedIntoHistory', function () {
    const path = window.location.pathname;
    document.querySelectorAll('.nav-link').forEach(link => {
      const target = link.getAttribute('hx-get');
      link.classList.toggle('active', target === path);
    });
  });

  document.getElementById('modal').addEventListener('htmx:afterSwap', async function () {
    const dialog = this.querySelector('wa-dialog');
    if (!dialog) return;
    await customElements.whenDefined('wa-dialog');
    dialog.show();
    dialog.addEventListener('wa-after-hide', () => {
      this.innerHTML = '';
    }, { once: true });
  });

  // --- Panel console (the panel's own log output) ---
  (function () {
    const bar = document.getElementById('panel-console');
    const output = document.getElementById('panel-console-output');
    if (!bar || !output) return;

    // Collapsible, defaulting to expanded.
    if (localStorage.getItem('panelConsoleOpen') === 'false') {
      bar.classList.add('collapsed');
    }

    window.togglePanelConsole = function () {
      const open = !bar.classList.toggle('collapsed');
      localStorage.setItem('panelConsoleOpen', String(open));
      if (open) scrollConsoleToBottom();
    };

    function scrollConsoleToBottom() {
      output.scrollTop = output.scrollHeight;
    }

    function highlightConsole() {
      if (typeof hljs === 'undefined') return;
      delete output.dataset.highlighted;
      hljs.highlightElement(output);
    }

    function appendConsole(text) {
      if (!text) return;
      const atBottom = output.scrollHeight - output.scrollTop - output.clientHeight < 40;
      output.textContent += (output.textContent ? '\n' : '') + text;
      highlightConsole();
      if (atBottom) scrollConsoleToBottom();
    }

    let consoleWs = null;
    function connectConsoleWs() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      consoleWs = new WebSocket(`${proto}//${location.host}/ws/console`);
      consoleWs.onmessage = function (e) {
        const msg = JSON.parse(e.data);
        if (msg.type === 'init') {
          output.textContent = msg.content || '';
          highlightConsole();
          scrollConsoleToBottom();
        } else if (msg.type === 'append') {
          appendConsole(msg.content);
        }
      };
      consoleWs.onclose = function () {
        consoleWs = null;
        setTimeout(connectConsoleWs, 3000);
      };
    }
    connectConsoleWs();
  })();

  // --- Backend connectivity heartbeat ---
  (function () {
    const toast = document.getElementById('backend-toast');
    if (!toast) return;
    let down = false;

    async function ping() {
      try {
        const res = await fetch('/ping', { cache: 'no-store' });
        if (!res.ok) throw new Error('bad status');
        if (down) {
          down = false;
          toast.hidden = true;
        }
      } catch (e) {
        if (!down) {
          down = true;
          toast.hidden = false;
        }
      }
    }

    setInterval(ping, 5000);
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/powershell.min.js"></script>
<script>
  hljs.registerLanguage('toml', function(hljs) {
    return {
      name: 'TOML',
      contains: [
        hljs.COMMENT('#', '$'),
        { className: 'section', begin: /^\s*\[+[^\]]*\]+/ },
        {
          begin: /^[a-zA-Z_][a-zA-Z0-9_.-]*\s*=/,
          returnBegin: true,
          contains: [{ className: 'attr', begin: /^[a-zA-Z_][a-zA-Z0-9_.-]*/ }]
        },
        { className: 'string', begin: /"""/, end: /"""/ },
        { className: 'string', begin: /'''/, end: /'''/ },
        hljs.QUOTE_STRING_MODE,
        { className: 'string', begin: /'/, end: /'/ },
        { className: 'number', begin: /[+-]?\b(\d[\d_]*(\.[\d_]+)?([eE][+-]?[\d_]+)?|0x[0-9a-fA-F_]+|0o[0-7_]+|0b[01_]+)\b/ },
        { className: 'literal', begin: /\b(true|false)\b/ }
      ]
    };
  });
</script>
<script>
  hljs.registerLanguage('log', function() {
    return {
      name: 'Minecraft Log',
      contains: [
        { className: 'comment', begin: /\[\d{2}:\d{2}:\d{2}\]/ },
        { className: 'keyword', begin: /\b(ERROR|FATAL)\b/ },
        { className: 'title', begin: /\bWARN\b/ },
        { className: 'string', begin: /\bINFO\b/ },
        { className: 'built_in', begin: /<\w+>/ },
        { className: 'comment', begin: /^\s+at /, end: /$/ },
        { className: 'number', begin: /\b\d+(\.\d+)?\b/ }
      ]
    };
  });
</script>
<script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>

</body>
</html>
