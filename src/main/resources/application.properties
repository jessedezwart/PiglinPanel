spring.application.name=piglinpanel
server.port=0
# Needed for desktop integration (browser autolaunch + system tray icon).
spring.main.headless=false
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
logging.level.org.springframework.web.client.RestClient=DEBUG
logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.http.client=DEBUG
